x-runtime: &runtime
  image: ${TIXGO_IMAGE:?Set TIXGO_IMAGE to the verified runtime image tag or digest}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 20s
  environment: &environment
    NODE_ENV: production
    DATABASE_URL: ${DATABASE_URL:?Set the runtime DATABASE_URL}
    REDIS_URL: ${REDIS_URL:?Set the runtime REDIS_URL}
    JWT_SECRET: ${JWT_SECRET:?Set the runtime JWT_SECRET}
    JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-300}
    MAX_EVENT_SEATS: ${MAX_EVENT_SEATS:-10000}
    BOOKING_LOCK_TIMEOUT_MS: ${BOOKING_LOCK_TIMEOUT_MS:-1000}
    BOOKING_TRANSACTION_TIMEOUT_MS: ${BOOKING_TRANSACTION_TIMEOUT_MS:-5000}
    BOOKING_RETRY_ATTEMPTS: ${BOOKING_RETRY_ATTEMPTS:-3}
    BOOKING_RETRY_DEADLINE_MS: ${BOOKING_RETRY_DEADLINE_MS:-10000}

services:
  api:
    <<: *runtime
    ports:
      - "127.0.0.1:${TIXGO_PORT:-3000}:3000"
    environment:
      <<: *environment
      PORT: "3000"

  reservation-worker:
    <<: *runtime
    command: ["node", "dist/workers/reservation-expiry.worker.js"]
    healthcheck:
      disable: true
    environment:
      <<: *environment
      RESERVATION_POLL_MS: ${RESERVATION_POLL_MS:-1000}
      RESERVATION_BATCH_SIZE: ${RESERVATION_BATCH_SIZE:-100}

networks:
  default:
    name: ${TIXGO_NETWORK:?Set TIXGO_NETWORK to the provisioned app/database network}
    external: true
