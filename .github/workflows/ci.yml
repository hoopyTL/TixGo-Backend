name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: tixgo-ci
      CI_ARTIFACT_DIR: artifacts/ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/tixgo_test
      TEST_REDIS_URL: redis://127.0.0.1:56379
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/tixgo_test
      REDIS_URL: redis://127.0.0.1:56379
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          mkdir -p "$CI_ARTIFACT_DIR"
          npm ci --ignore-scripts 2>&1 | tee "$CI_ARTIFACT_DIR/npm-ci.log"

      - name: Start isolated test services
        run: |
          docker compose --profile test up -d --wait test-db test-redis 2>&1 | tee "$CI_ARTIFACT_DIR/services-start.log"

      - name: Run backend verification
        run: npm run test:ci

      - name: Collect service diagnostics
        if: always()
        run: |
          mkdir -p "$CI_ARTIFACT_DIR"
          docker compose --profile test ps --all > "$CI_ARTIFACT_DIR/services-state.log" 2>&1
          docker compose --profile test logs --no-color --timestamps test-db test-redis > "$CI_ARTIFACT_DIR/services.log" 2>&1

      - name: Stop test services
        if: always()
        run: docker compose --profile test rm --stop --force test-db test-redis

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
